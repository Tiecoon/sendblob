name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build frontend
        run: |
          nix develop --command npm ci
          nix develop --command npm run build:release
      - name: Build and load image
        run: |
          nix run . -- --out-link "$RUNNER_TEMP/sendblob-image"
          docker load < "$RUNNER_TEMP/sendblob-image"
          docker image inspect --format 'Image size: {{.Size}} bytes' sendblob:latest
      - name: Smoke test
        run: |
          docker compose up -d
          trap 'docker compose logs; docker compose down' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/
          wasm=$(find dist -name '*.wasm' -printf '%P\n' -quit)
          test -n "$wasm"
          curl --fail --head "http://127.0.0.1:8080/$wasm" | grep -i 'Content-Type: application/wasm'
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag sendblob:latest "$tag"
            docker push "$tag"
          done <<< "$TAGS"
